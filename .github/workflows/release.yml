name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm run check
      - run: npm run build
      - name: Ensure tag matches package version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${RELEASE_TAG#v}" = "$(node -p "require('./package.json').version")"
      - name: Publish if this version is not on npm
        run: |
          if npm view "kiss-or-slap@${RELEASE_TAG#v}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version already on npm; skipping publish"
          else
            npm publish --access public
          fi
      - run: npm pack
      - name: Create GitHub release with npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" kiss-or-slap-*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" kiss-or-slap-*.tgz --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
