name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm run check
      - run: npm run build
      - name: Ensure tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Publish if this version is not on npm
        run: |
          if npm view "kiss-or-slap@${GITHUB_REF_NAME#v}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version already on npm; skipping publish"
          else
            npm publish --access public
          fi
      - run: npm pack
      - name: Attach npm tarball to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" kiss-or-slap-*.tgz
